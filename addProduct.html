<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Add / Edit Product</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container-fluid p-4">
      <!-- FORM PRINCIPAL -->
      <form id="productForm">
        <!-- Navbar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold">Add / Edit Product</h3>
          <div>
            <a href="./dash.html" class="btn btn-outline-secondary me-2">
              Discard
            </a>
            <button type="submit" class="btn btn-success">
              Save Product
            </button>
          </div>
        </div>

        <div class="row g-4">
          <!-- LEFT COLUMN -->
          <div class="col-lg-8">
            <!-- Basic Information -->
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title mb-3">Basic Information</h5>

                <div class="mb-3">
                  <label for="productName" class="form-label">
                    Product Name
                  </label>
                  <input
                    type="text"
                    id="productName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="productCategory" class="form-label">
                    Brand
                  </label>
                  <input
                    type="text"
                    id="productBrand"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="productDescription" class="form-label">
                    Product Description
                  </label>
                  <textarea
                    id="productDescription"
                    class="form-control"
                    rows="4"
                    required
                  ></textarea>
                </div>
              </div>
            </div>

            <!-- Pricing & Inventory -->
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title mb-3">Pricing & Inventory</h5>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productPrice" class="form-label">
                      Price ($)
                    </label>
                    <input
                      type="number"
                      id="productPrice"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="productStock" class="form-label">
                      Stock
                    </label>
                    <input
                      type="number"
                      id="productStock"
                      class="form-control"
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="productStatus" class="form-label">
                      View Status
                    </label>
                    <select id="productStatus" class="form-select">
                      <option value="visible">Visible</option>
                      <option value="hidden">Not Visible</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- Images -->
            <div class="card">
              <div class="card-body">
                <h5 class="card-title mb-3">Product Image</h5>
                <input id="productImg"type="file" class="form-control" />
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div class="col-lg-4">
            <div class="card">
              <div class="card-body text-center">
                <span class="badge bg-success mb-2">NEW ARRIVAL</span>

                <img
                  src="racket.png"
                  class="img-fluid my-3"
                  style="max-height: 220px"
                />

                <p class="text-muted mb-1">PRODUCT CATEGORY</p>
                <h5 class="fw-bold">Product Preview</h5>
                <h4 class="text-success fw-bold">$0.00</h4>

                <button type="button" class="btn btn-dark w-100 mt-3">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <script src="./editar.js"></script>
  </body>
</html>
