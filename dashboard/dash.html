<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body { background:#f6f8f5; font-family: system-ui; }

.sidebar {
  width:240px;
  min-height:100vh;
  background:#fff;
  border-right:1px solid #e5e7eb;
  display:flex;
  flex-direction:column;
}
.brand {
  font-size:20px;
  font-weight:700;
  padding:20px;
  display:flex;
  gap:10px;
  align-items:center;
}
.nav-link {
  margin:5px 12px;
  border-radius:8px;
  color:#374151;
}
.nav-link.active {
  background:#e6f9ef;
  color:#16a34a;
  font-weight:600;
}
.topbar {
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:15px 25px;
}
.btn-green {
  background:#22c55e;
  color:white;
  border-radius:10px;
  font-weight:600;
}
.badge-soft {
  background:#eef2f7;
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
}
.status-green { color:#16a34a; font-weight:600 }
.product-img {
  width:42px;
  height:42px;
  background:#e5e7eb;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="d-flex">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <span class="badge bg-success"></span> <img src="dash-img/ChatGPT Image 20 ene 2026, 21_08_02.png" width="150px" alt="">
  </div>

  <nav class="nav nav-pills flex-column" role="tablist">
    <a class="nav-link active" data-bs-toggle="tab" href="#products-section">Products</a>
    <a class="nav-link" data-bs-toggle="tab" href="#orders-section">Orders</a>
    <a class="nav-link" data-bs-toggle="tab" href="#customers-section">Customers</a>
    <a class="nav-link disabled">Analytics</a>
    <a class="nav-link disabled">Settings</a>
  </nav>

  <div class="mt-auto p-3">
    <button class="btn btn-outline-secondary w-100">Log Out</button>
  </div>
</aside>

<!-- MAIN -->
<main class="flex-grow-1">

<div class="topbar d-flex justify-content-between align-items-center">
  <h4 class="fw-bold mb-0">Inventory Management</h4>

  <div class="d-flex gap-3 align-items-center">
    <input class="form-control" placeholder="Search..." style="width:220px">
    <i class="bi bi-bell fs-5"></i>
    <div class="d-flex align-items-center gap-2">
      <img src="https://i.pravatar.cc/40" class="rounded-circle">
      <div>
        <strong>Admin User</strong><br>
        <small class="text-muted">Store Manager</small>
      </div>
    </div>
  </div>
</div>





<div class="p-4">

<div class="tab-content">

<!-- PRODUCTS -->
<div class="tab-pane fade show active" id="products-section">
  <div class="d-flex justify-content-between mb-3">
    <div class="d-flex gap-2">
      <button class="btn btn-dark btn-sm">All Products</button>
      <button class="btn btn-light btn-sm">Men's Gear</button>
      <button class="btn btn-light btn-sm">Women's Gear</button>
    </div>
    <a href="../editar/editar.html"><button class ="btn btn-green">add product</button></a>
    


  </div>

  <table class="table align-middle">
  <thead>
    <tr>
      <th>PREVIEW</th>
      <th>PRODUCT</th>
      <th>CATEGORY</th>
      <th>PRICE</th>
      <th>STOCK</th>
      <th>ACTIONS</th>
    </tr>
  </thead>

  <tbody id="productsTable">
    <!--JS  -->
  </tbody>
</table>

</div>

<!-- ORDERS -->
<div class="tab-pane fade" id="orders-section">
  <h4 class="fw-bold mb-3">Orders</h4>
  <table class="table">
    <tr><td>#ORD-1023 – Tennis Shoes</td></tr>
  </table>
</div>

<!-- CUSTOMERS -->
<div class="tab-pane fade" id="customers-section">
  <h4 class="fw-bold mb-3">Customers</h4>
  <table class="table">
    <tr><td>Jane Doe – Active</td></tr>
    <tr><td>Juana –inactive</td></tr>
  </table>
</div>

</div>
</div>
</main>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
